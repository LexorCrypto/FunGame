<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PISSUARIUS — аркада в стиле 80-х</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #050510;
    color: #fff;
    font-family: "Courier New", ui-monospace, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    overflow: hidden;
  }
  .star {
    position: fixed;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes twinkle { from { opacity: .15; } to { opacity: .9; } }
  h1 {
    font-size: clamp(2rem, 8vw, 4.5rem);
    letter-spacing: .18em;
    color: #ffe14d;
    text-shadow:
      0 0 8px rgba(255, 225, 77, .8),
      4px 4px 0 #b3381f,
      8px 8px 0 rgba(0, 0, 0, .55);
    text-align: center;
  }
  .subtitle {
    color: #4dc3ff;
    letter-spacing: .3em;
    font-size: clamp(.7rem, 2.5vw, 1rem);
    text-align: center;
  }
  .insert-coin {
    color: #7dff6a;
    letter-spacing: .25em;
    font-size: clamp(.8rem, 3vw, 1.2rem);
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  a.play {
    display: inline-block;
    padding: 1rem 3rem;
    font-size: clamp(1rem, 3.5vw, 1.4rem);
    letter-spacing: .2em;
    color: #050510;
    background: #ffe14d;
    text-decoration: none;
    border: 4px solid #b3381f;
    box-shadow: 0 6px 0 #b3381f, 0 0 24px rgba(255, 225, 77, .45);
    transition: transform .08s, box-shadow .08s;
  }
  a.play:hover { transform: translateY(2px); box-shadow: 0 4px 0 #b3381f, 0 0 32px rgba(255, 225, 77, .7); }
  a.play:active { transform: translateY(6px); box-shadow: 0 0 0 #b3381f; }
  .controls-hint {
    color: #8a8aa8;
    font-size: .85rem;
    letter-spacing: .15em;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <h1>PISSUARIUS</h1>
  <p class="subtitle">ГАЛАКТИЧЕСКАЯ ЗАЧИСТКА &bull; АРКАДА 80-Х</p>
  <a class="play" href="game.html">ИГРАТЬ</a>
  <p class="insert-coin">INSERT COIN</p>
  <p class="controls-hint">WASD — ДВИЖЕНИЕ &bull; ПРОБЕЛ — ОГОНЬ</p>
<script>
  // Декоративный звёздный фон стартовой страницы (не игровой код)
  const sky = document.body;
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 1;
    s.style.width = s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 2) + 's';
    s.style.animationDuration = (1 + Math.random() * 2.5) + 's';
    sky.appendChild(s);
  }
</script>
</body>
</html>
